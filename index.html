<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Task Board</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --txt:#e7e9ee; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#3a6df0;
    --a:#ff6b6b; --b:#ffb454; --c:#4cc38a; --danger:#ff5d5d; --ok:#4cc38a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  textarea{width:100%;resize:vertical;min-height:120px}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* layout */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  header .title{font-weight:700;font-size:15px;margin-right:4px}
  header .grow{flex:1}
  header input[type=search]{min-width:160px}
  .btn{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent2);border-color:var(--accent2)}
  .btn.danger{border-color:var(--danger);color:var(--danger)}
  .pill{padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);font-size:12px}

  #tagbar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
  .tagchip{cursor:pointer;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--muted)}
  .tagchip.active{background:var(--accent2);border-color:var(--accent2);color:#fff}

  #main{flex:1;display:flex;min-height:0}
  #sidebar{width:300px;min-width:200px;max-width:50%;background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:8px}
  #content{flex:1;overflow:auto;padding:16px 20px}

  /* tree */
  .tree{list-style:none;margin:0;padding:0}
  .tree ul{list-style:none;margin:0;padding-left:16px}
  .node{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .node:hover{background:var(--panel2)}
  .node.sel{background:var(--accent2);color:#fff}
  .node .tw{width:14px;display:inline-block;text-align:center;color:var(--muted)}
  .node .ic{width:16px;text-align:center}
  .node .nm{overflow:hidden;text-overflow:ellipsis}
  .node .cnt{margin-left:auto;color:var(--muted);font-size:11px}
  .node.sel .cnt{color:#dbe4ff}

  /* tasks */
  .task{display:flex;align-items:flex-start;gap:8px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:8px}
  .task.done{opacity:.55}
  .task.done .ttext{text-decoration:line-through}
  .task input[type=checkbox]{width:18px;height:18px;margin-top:2px}
  .task .ttext{flex:1}
  .badge{font-weight:700;font-size:11px;border-radius:6px;padding:1px 7px;margin-right:6px}
  .badge.A{background:rgba(255,107,107,.18);color:var(--a);border:1px solid var(--a)}
  .badge.B{background:rgba(255,180,84,.18);color:var(--b);border:1px solid var(--b)}
  .badge.C{background:rgba(76,195,138,.18);color:var(--c);border:1px solid var(--c)}
  .due{font-size:12px;color:var(--muted);margin-left:6px}
  .due.over{color:var(--danger);font-weight:700}
  .due.soon{color:var(--b);font-weight:700}
  .ttags{display:inline-flex;gap:4px;margin-left:6px}
  .ttag{font-size:11px;color:var(--accent)}
  .task .row{display:flex;align-items:center;flex-wrap:wrap}
  .task .acts{display:flex;gap:6px;margin-left:8px}
  .iconbtn{background:none;border:none;color:var(--muted);padding:2px 4px}
  .iconbtn:hover{color:var(--txt)}

  .md{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel);margin-top:8px}
  .md h1,.md h2,.md h3{margin:.4em 0}
  .md pre{background:#0b0d12;padding:10px;border-radius:8px;overflow:auto}
  .md code{background:#0b0d12;padding:1px 5px;border-radius:5px}
  .md ul{padding-left:20px}

  .sectiontitle{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
  .sectiontitle h2{margin:0;font-size:18px}
  .muted{color:var(--muted)}
  .center{display:flex;align-items:center;justify-content:center;height:100%}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:420px;width:100%}
  .card h1{margin:0 0 4px;font-size:20px}
  .field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
  .field label{font-size:12px;color:var(--muted)}
  .err{color:var(--danger);font-size:13px;min-height:18px}
  .ok{color:var(--ok);font-size:13px}
  .quickadd{display:flex;gap:8px;margin:10px 0 16px}
  .quickadd input{flex:1}
  .statgrid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:120px}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{color:var(--muted);font-size:12px}
  @media (max-width:680px){
    #sidebar{position:absolute;z-index:5;height:calc(100% - 0px);box-shadow:0 0 40px #000}
    #sidebar.collapsed{display:none}
  }
</style>
</head>

<div id="app">
  <header id="topbar" class="hidden">
    <button class="btn" id="menuBtn" title="트리 토글">☰</button>
    <span class="title">🗂️ Task Board</span>
    <input type="search" id="search" placeholder="전체 검색…" />
    <button class="btn" id="viewBoard">보드</button>
    <button class="btn" id="viewDash">대시보드</button>
    <span class="grow"></span>
    <button class="btn" id="roBtn" title="이 기기에서 읽기전용/편집 전환"></button>
    <span class="pill" id="whoami"></span>
    <button class="btn" id="refreshBtn" title="새로고침">⟳</button>
    <button class="btn" id="logoutBtn">로그아웃</button>
  </header>
  <div id="tagbar" class="hidden"></div>
  <div id="main" class="hidden">
    <div id="sidebar"></div>

</div>

<script type="text/markdown" id="offlinePlanDoc">
# 📄 오프라인 지원 계획서

작성일: 2026-06-05 · 대상: Task Board 웹앱(index.html, GitHub Pages) 의 "페이지 오프라인" 동작
범위: 효과 / 오버헤드 / 사이드 이펙트 + 단계별 실행 계획 + 자료 조사 요약

## 1. 목적 (Why)
현재 웹앱은 온라인 전제로 동작한다. 페이지(HTML/JS/CSS)와 데이터(Supabase)를 모두 네트워크에서 받으므로, 끊기거나 사내 프록시가 차단하면 빈 화면/로딩 실패가 된다.
목표:
- 네트워크가 없어도 앱 셸(화면)이 즉시 뜨고, 본 데이터는 읽을 수 있게 한다.
- 재방문 로딩 속도를 개선한다(캐시 우선).
- (선택) 오프라인 변경분을 로컬에 쌓아두었다가 온라인 복귀 시 동기화한다.

## 2. 현재 구조 (As-Is)
- 앱 셸(HTML/JS/CSS, vendor): 매 방문 네트워크 로드 → 오프라인 시 화면 자체가 안 뜸
- 데이터(nodes/tasks): Supabase 실시간 조회 → 끊기면 빈 목록/오류
- 인증 세션: 토큰은 남지만 검증/갱신은 온라인 필요
- 쓰기(추가/수정/삭제): 즉시 Supabase 반영 → 끊기면 실패

핵심: 앱 셸과 데이터 두 계층 모두 오프라인 대비가 필요하다.

## 3. 구현 방식 (How)
- 셸 오프라인: Service Worker + Cache API 로 정적 자산 사전 캐시. 정적=cache-first, API=network-first/stale-while-revalidate. manifest 추가 시 PWA(설치·독립 창).
- 데이터 오프라인: 마지막 nodes/tasks 를 IndexedDB(권장)/localStorage 에 저장 → 오프라인 스냅샷 표시. (선택) 오프라인 변경분을 mutation queue 로 쌓아 복귀 시 전송.
- 동기화 충돌: Last-Write-Wins(updated_at 최신 우선) 가 개인용엔 충분. CRDT/필드병합은 동시편집 많을 때만(본 앱엔 과함).
- 권고 순서: (1) 셸 오프라인 → (2) 읽기 캐시 → (3) 쓰기 큐/동기화.

## 4. 기대 효과
- 즉시 로딩/재방문 속도 향상(네트워크 왕복 제거)
- 네트워크 단절 내성(빈 화면 방지)
- 대역폭·서버 부하 절감
- PWA 앱 경험(설치·독립 창·아이콘)

## 5. 오버헤드 (Cost)
- 개발 복잡도: 서비스워커 생명주기·캐시 버전 관리 학습(Workbox 로 완화)
- 빌드/배포: 자산 버전 해시, SW 갱신 로직 추가
- 저장 공간: 캐시+IndexedDB 디스크 사용(모바일 Cache API 약 50MB/파티션)
- 메모리/CPU: SW 등록·fetch 가로채기(미미)
- 유지보수: 캐시 무효화·SW 업데이트 테스트 상시 필요

## 6. 사이드 이펙트 & 리스크 (가장 중요)
- 갱신 안 됨(Stale cache): 버전 없는 자산 cache-first 시 옛 버전 고정. SW 파일 자체 캐시 시 신규 배포 최대 24h 지연. → 캐시 이름에 버전, SW는 no-cache, API는 network-first, activate 에서 옛 캐시 정리, "새 버전 → 새로고침" 안내.
- 저장소 제거(Eviction): 디스크 부족 시 LRU 삭제. Safari/iOS 는 7일 미사용 시 스크립트 저장소 전체 삭제. → navigator.storage.persist() + 명시적 JSON 백업.
- 동기화 충돌/손실: LWW 는 늦게 쓴 쪽이 덮어씀(손실 가능). → 읽기 오프라인부터, 쓰기는 충돌 빈도 확인 후.
- 보안(사내 환경 특히): 캐시/IndexedDB 는 데이터를 디스크에 평문 잔존. 서비스워커는 세션을 넘어 지속 → XSS 1회 성공이 SW 캐시를 오염시켜 지속적 주입/중간자로 악화될 수 있음. → 민감/회사 데이터는 캐시하지 않음, CSP 적용, 필요 시 암호화, 로그아웃 시 캐시·SW 해제, HTTPS 전제.
- 디버깅 난이도: "새로고침해도 안 바뀜" 진단이 까다로움 → SW 패널/하드리셋 절차 표준화.

## 7. 단계별 실행 계획
- Phase 0 — 사전 검토(0.5d): HTTPS 확인, 캐시 대상 자산 확정, 보안 정책(민감정보 제외) 결정
- Phase 1 — 셸 오프라인 + PWA(1~2d): manifest, service-worker(precache, 버전드 캐시, 정리), 오프라인 폴백, 업데이트 안내. 검증=Lighthouse + 비행기모드
- Phase 2 — 데이터 읽기 오프라인(1~2d): nodes/tasks IndexedDB 스냅샷, "오프라인 — 마지막 동기화 시각" 배지
- Phase 3 — (선택) 쓰기 큐+동기화(3~5d, 위험 큼): mutation queue, LWW, 재시도, 충돌 테스트
- Phase 4 — 관측/운영: 캐시 적중률, storage.estimate(), SW 반영률 모니터링

## 8. 검증/측정 지표
Lighthouse(PWA/Perf/Best-Practices), 오프라인 로드 성공률, 재방문 로드 시간, 저장 사용량/eviction, (P3) 동기화 지연·충돌·손실 건수

## 9. 권고
- 어디까지? → Phase 1(셸)+2(읽기) 까지 권장. 쓰기 오프라인(P3)은 효용 확인 후.
- 민감/회사 데이터 캐시 → 하지 않음(원칙).
- Workbox → 보일러플레이트 절감(단일 파일이면 간단한 수제 SW도 가능).

## 10. 참고 자료
- MDN — Offline and background operation: https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps/Guides/Offline_and_background_operation
- MDN — Storage quotas and eviction criteria: https://developer.mozilla.org/en-US/docs/Web/API/Storage_API/Storage_quotas_and_eviction_criteria
- web.dev — Storage for the web: https://web.dev/articles/storage-for-the-web
- HTTP Archive — Web Almanac 2025 (PWA): https://almanac.httparchive.org/en/2025/pwa
- Workbox — Service worker deployment: https://developer.chrome.com/docs/workbox/service-worker-deployment
- Taming PWA Cache Behavior: https://iinteractive.com/resources/blog/taming-pwa-cache-behavior
- LogRocket — Offline-first frontend apps in 2025: https://blog.logrocket.com/offline-first-frontend-apps-2025-indexeddb-sqlite/
- Service Worker caches 보안 연구: https://secpriv.wien/fulltext/publik_296700.pdf
- Chromium — Service Worker Security FAQ: https://chromium.googlesource.com/chromium/src/+/main/docs/security/service-worker-security-faq.md

(이 페이지는 앱에 내장된 읽기전용 문서입니다. 전체 원본: 저장소 docs/offline-plan.md)

"use strict";
// ===========================================================================
// 설정: Supabase 프로젝트 URL 과 anon(public) 키.
// (anon 키는 공개돼도 RLS가 보호하므로 안전. service_role 키는 절대 넣지 말 것!)
// Supabase 대시보드 > Project Settings > API 에서 복사.
// ===========================================================================
const CONFIG = {
  SUPABASE_URL: "https://sxujnpvhgwcjoiimylki.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4dWpucHZoZ3djam9paW15bGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDQ1NzMsImV4cCI6MjA5NjEyMDU3M30.K7rhqHVgpQfxttlMkaXkM6YsWbx99p3IX2hM50nP7IE",
};

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,props={},...kids)=>{const n=document.createElement(tag);
  for(const k in props){ if(k==="class")n.className=props[k]; else if(k==="html")n.innerHTML=props[k];
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),props[k]); else if(props[k]!=null)n.setAttribute(k,props[k]); }
  for(const c of kids.flat()){ if(c!=null) n.append(c.nodeType?c:document.createTextNode(c)); }
  return n;};
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = ()=> new Date().toLocaleDateString("sv");      // YYYY-MM-DD (local)

const state = {
  client:null, session:null, profile:null,
  nodes:[], tasks:[],
  selectedId:null, expanded:new Set(JSON.parse(localStorage.getItem("tb_expanded")||"[]")),
  search:"", activeTag:null, view:"board",
  readonly: localStorage.getItem("tb_readonly")==="1",   // 기기별 읽기전용 잠금(회사 PC용)
};
// 공유 보드 + 역할 기반: 승인된 admin/editor 만 편집 가능. viewer 는 읽기만(서버 RLS도 동일하게 강제).
// 추가로, 이 기기가 읽기전용 모드면 admin/editor 라도 편집 차단(회사 PC 실수 방지).
const canWrite = ()=> !!(state.profile && state.profile.approved && (state.profile.role==="admin"||state.profile.role==="editor")) && !state.readonly;

// ---------------------------------------------------------------------------
// 부팅
// ---------------------------------------------------------------------------
function isConfigured(){ return CONFIG.SUPABASE_URL.startsWith("http") && CONFIG.SUPABASE_ANON_KEY.length>20; }

window.addEventListener("DOMContentLoaded", init);

async function init(){
  if(!isConfigured()){ return showSetup(); }
  state.client = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const { data:{ session } } = await state.client.auth.getSession();
  state.session = session;
  state.client.auth.onAuthStateChange((_e,s)=>{ state.session=s; route(); });
  route();
}

async function route(){
  if(!state.session){ return showLogin(); }
  // 프로필(승인/역할) 로드
  const { data:prof, error } = await state.client.from("profiles").select("*").eq("id", state.session.user.id).maybeSingle();
  if(error){ return showLogin("프로필을 불러오지 못했습니다: "+error.message); }
  state.profile = prof;
  if(!prof || !prof.approved){ return showPending(); }
  await loadData();
  showApp();
}

// ---------------------------------------------------------------------------
// 화면: 셋업 / 로그인 / 승인대기
// ---------------------------------------------------------------------------
function gate(node){ $("#topbar").classList.add("hidden"); $("#tagbar").classList.add("hidden"); $("#main").classList.add("hidden");
  const g=$("#gate"); g.classList.remove("hidden"); g.innerHTML=""; g.append(node); }

function showSetup(){
  gate(el("div",{class:"card"},
    el("h1",{},"설정이 필요합니다"),
    el("p",{class:"muted"},"index.html 상단 CONFIG 에 Supabase 프로젝트 URL 과 anon 키를 입력하세요."),
    el("p",{class:"muted"},"Supabase 대시보드 → Project Settings → API 에서 복사할 수 있습니다. 자세한 절차는 README.md 참고."),
  ));
}

function showLogin(msg){
  const email=el("input",{type:"email",placeholder:"you@example.com",autocomplete:"username"});
  const pw=el("input",{type:"password",placeholder:"비밀번호",autocomplete:"current-password"});
  const err=el("div",{class:"err"},msg||"");

async function loadData(){

    state.client.from("nodes").select("*").order("position").order("created_at"),
    state.client.from("tasks").select("*").order("position").order("created_at"),
  ]);

function childrenOf(pid){ return state.nodes.filter(n=>n.parent_id===pid); }

function buildTree(ul,pid){
  childrenOf(pid).forEach(n=>{
    const kids=childrenOf(n.id);
    const isFolder=n.type==="folder";
    const open=state.expanded.has(n.id);
    const row=el("li",{});
    const cnt=openTaskCount(n.id);
    const node=el("div",{class:"node"+(state.selectedId===n.id?" sel":""),onclick:(e)=>{
        if(isFolder){ toggleExpand(n.id); } else { state.selectedId=n.id; state.view="board"; render(); }
      }},
      el("span",{class:"tw"}, isFolder?(open?"▾":"▸"):""),
      el("span",{class:"ic"}, isFolder?"📁":"📄"),
      el("span",{class:"nm"}, n.title||"(제목 없음)"),
      (!isFolder && cnt>0)? el("span",{class:"cnt"}, String(cnt)) : null,
    );
    if(canWrite() && !n.builtin) node.append(nodeMenu(n));
    row.append(node);
    if(isFolder && open){ const sub=el("ul",{}); buildTree(sub,n.id); row.append(sub); }
    ul.append(row);
  });
}
function nodeMenu(n){

  return wrap;
}

}

function taskRow(t, showPath){
  const wrap=el("div",{class:"task"+(t.done?" done":"")});
  const cb=el("input",{type:"checkbox"}); cb.checked=!!t.done; cb.disabled=!canWrite();
  cb.addEventListener("change",()=>updateTask(t.id,{done:cb.checked}));
  const row=el("div",{class:"row"});
  if(t.priority) row.append(el("span",{class:"badge "+t.priority}, t.priority));
  row.append(el("span",{class:"ttext"}, t.text||""));
  if(t.due_date){ const cls=dueClass(t.due_date); row.append(el("span",{class:"due "+cls}, "📅 "+t.due_date)); }
  if(t.tags&&t.tags.length){ const tg=el("span",{class:"ttags"}); t.tags.forEach(x=>tg.append(el("span",{class:"ttag"},"#"+x))); row.append(tg); }
  if(showPath){ row.append(el("span",{class:"due"}, "· "+nodePath(t.node_id))); }
  const main=el("div",{style:"flex:1"}, row);
  wrap.append(cb, main);
  if(canWrite()){
    wrap.append(el("div",{class:"acts"},
      el("button",{class:"iconbtn",title:"수정",onclick:()=>editTask(t)},"✎"),
      el("button",{class:"iconbtn",title:"삭제",onclick:()=>deleteTask(t.id)},"🗑"),
    ));
  }
  return wrap;
}
function dueClass(d){ const today=todayStr(); if(d<today) return "over";
  const dt=new Date(d), now=new Date(today); const diff=(dt-now)/86400000; return diff<=2?"soon":""; }
function nodePath(id){ const parts=[]; let n=state.nodes.find(x=>x.id===id);
  while(n){ parts.unshift(n.title||"?"); n=state.nodes.find(x=>x.id===n.parent_id); } return parts.join(" / "); }

// 입력 파싱: "(A) 내용 @2026-06-10 #tag1 #tag2"
function parseTaskInput(s){
  let text=s.trim(); let priority=null, due=null; const tags=[];
  const pm=text.match(/^\(([ABC])\)\s*/i); if(pm){ priority=pm[1].toUpperCase(); text=text.slice(pm[0].length); }
  const dm=text.match(/@(\d{4}-\d{2}-\d{2})/); if(dm){ due=dm[1]; text=text.replace(dm[0],""); }
  text=text.replace(/#([^\s#]+)/g,(_,g)=>{tags.push(g);return "";});
  return { text:text.trim(), priority, due_date:due, tags };
}

function renderDashboard(){
  const c=$("#content"); c.innerHTML="";
  c.append(el("div",{class:"sectiontitle"}, el("h2",{},"📊 대시보드")));
  const total=state.tasks.length, done=state.tasks.filter(t=>t.done).length, open=total-done;
  const overdue=state.tasks.filter(t=>!t.done&&t.due_date&&t.due_date<todayStr()).length;
  c.append(el("div",{class:"statgrid"},
    stat(total,"전체"), stat(open,"미완료"), stat(done,"완료"), stat(overdue,"기한 초과")));
  // 30일 버킷
  const days=[]; const base=new Date(todayStr());
  for(let i=29;i>=0;i--){ const d=new Date(base); d.setDate(base.getDate()-i); days.push(d.toLocaleDateString("sv")); }
  const counts={}; days.forEach(d=>counts[d]=0);
  state.tasks.forEach(t=>{ if(t.done_at){ const d=new Date(t.done_at).toLocaleDateString("sv"); if(d in counts) counts[d]++; }});
  const series=days.map(d=>counts[d]);
  c.append(el("div",{class:"sectiontitle",style:"margin-top:10px"}, el("h2",{style:"font-size:15px"},"최근 30일 완료 추이")));
  c.append(lineChart(days,series));
  const sum=series.reduce((a,b)=>a+b,0);
  c.append(el("p",{class:"muted"}, `최근 30일 완료 합계: ${sum}건`));
}
function stat(n,l){ return el("div",{class:"stat"}, el("div",{class:"n"},String(n)), el("div",{class:"l"},l)); }

function lineChart(labels,data){
  const W=720,H=240,P=34;
  const max=Math.max(1,...data);                 // 0 나눗셈 방지
  const n=data.length;
  const x=i=> P + (n<=1?0:(i*(W-2*P)/(n-1)));
  const y=v=> H-P - (v*(H-2*P)/max);
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width","100%"); svg.setAttribute("style","max-width:720px;background:var(--panel);border:1px solid var(--border);border-radius:12px");
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  // y 그리드 + 라벨
  const ticks=Math.min(max,4);
  for(let i=0;i<=ticks;i++){ const val=Math.round(max*i/ticks); const yy=y(val);
    svg.append(mk("line",{x1:P,y1:yy,x2:W-P,y2:yy,stroke:"#2a2f3a","stroke-width":1}));
    const tx=mk("text",{x:P-6,y:yy+4,fill:"#9aa3b2","font-size":11,"text-anchor":"end"}); tx.textContent=val; svg.append(tx);
  }
  // x 라벨(처음/중간/끝)
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{ const tx=mk("text",{x:x(i),y:H-P+16,fill:"#9aa3b2","font-size":11,"text-anchor":"middle"});
    tx.textContent=(labels[i]||"").slice(5); svg.append(tx); });
  // 라인
  if(n===1){ svg.append(mk("circle",{cx:x(0),cy:y(data[0]),r:4,fill:"#5b8cff"})); }
  else { const d=data.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    svg.append(mk("path",{d,fill:"none",stroke:"#5b8cff","stroke-width":2})); }
  // 점
  data.forEach((v,i)=>{ if(v>0) svg.append(mk("circle",{cx:x(i),cy:y(v),r:3,fill:"#5b8cff"})); });
  return svg;
}

async function renameNode(n){ if(!await guardWrite())return;
  const title=prompt("이름 변경", n.title); if(title==null)return;

  if(!confirm(`"${n.title}" 삭제할까요?`+(kids||tcount?` (하위 ${kids}개 / 태스크 ${tcount}개도 함께 삭제)`:"")))return;
  const { error } = await state.client.from("nodes").delete().eq("id",n.id);
  if(error)return alert("삭제 실패: "+error.message);

async function updateNode(id,fields){ if(!await guardWrite())return;

  if(error)return alert("저장 실패: "+error.message); await reload(); }

async function addTaskFromInput(nodeId,raw){ if(!await guardWrite())return;
  const p=parseTaskInput(raw); if(!p.text){ alert("내용을 입력하세요."); return; }
  const { error } = await state.client.from("tasks").insert({node_id:nodeId, text:p.text, priority:p.priority, due_date:p.due_date, tags:p.tags, position:Date.now()%100000});
  if(error)return alert("추가 실패: "+error.message); await reload(); }
async function updateTask(id,fields){ if(!await guardWrite())return;
  const { error } = await state.client.from("tasks").update(fields).eq("id",id);
  if(error)return alert("수정 실패: "+error.message); await reload(); }
async function deleteTask(id){ if(!await guardWrite())return;
  if(!confirm("태스크를 삭제할까요?"))return;
  const { error } = await state.client.from("tasks").delete().eq("id",id);
  if(error)return alert("삭제 실패: "+error.message); await reload(); }
async function editTask(t){ if(!await guardWrite())return;
  const cur=`${t.priority?`(${t.priority}) `:""}${t.text}${t.due_date?` @${t.due_date}`:""}${(t.tags||[]).map(x=>" #"+x).join("")}`;
  const raw=prompt("태스크 수정 — 형식: (A) 내용 @YYYY-MM-DD #태그", cur); if(raw==null)return;
  const p=parseTaskInput(raw); await updateTask(t.id,{text:p.text,priority:p.priority,due_date:p.due_date,tags:p.tags}); }

// ---------------------------------------------------------------------------
// 최소 Markdown 렌더 + DOMPurify 살균 (XSS 방지)
// ---------------------------------------------------------------------------
function mdToHtml(md){
  const lines=String(md).replace(/\r\n/g,"\n").split("\n");
  let html="", inCode=false, inList=false;
  const inline=s=>esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  for(let raw of lines){
    if(raw.trim().startsWith("```")){ if(inCode){html+="</code></pre>";inCode=false;} else {if(inList){html+="</ul>";inList=false;}html+="<pre><code>";inCode=true;} continue; }
    if(inCode){ html+=esc(raw)+"\n"; continue; }
    const h=raw.match(/^(#{1,3})\s+(.*)$/);
    const li=raw.match(/^\s*[-*]\s+(.*)$/);
    if(h){ if(inList){html+="</ul>";inList=false;} html+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if(li){ if(!inList){html+="<ul>";inList=true;} html+=`<li>${inline(li[1])}</li>`; continue; }
    if(inList){html+="</ul>";inList=false;}
    if(raw.trim()==="") html+=""; else html+=`<p>${inline(raw)}</p>`;
  }
  if(inCode)html+="</code></pre>"; if(inList)html+="</ul>";
  return window.DOMPurify.sanitize(html,{ALLOWED_TAGS:["h1","h2","h3","p","ul","li","strong","em","code","pre","a","br"],ALLOWED_ATTR:["href","target","rel"]});
}
</script>
</body>
</html>
